name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    # The live portion of this job upgrades one owner-approved shared
    # workspace. Never allow two candidates to reconcile or canary it at once.
    concurrency:
      group: apm-live-validation-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: criblio/cribl-search-app-framework/.github/actions/release-build@d5a6e46bee3f6fd9052a96dcaacf28fe0483a4da
        with:
          framework-sha: d5a6e46bee3f6fd9052a96dcaacf28fe0483a4da
      - name: Retain the exact tested candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-candidate-${{ github.sha }}
          path: build/apm-*
          if-no-files-found: error
          retention-days: 14
      - name: Install browser for live Cribl smoke tests
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: npx playwright install --with-deps chromium
      - name: Upgrade the shared validation workspace with the exact candidate
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          CRIBL_BASE_URL: ${{ secrets.CRIBL_RELEASE_VALIDATION_BASE_URL }}
          CRIBL_CLIENT_ID: ${{ secrets.CRIBL_RELEASE_VALIDATION_CLIENT_ID }}
          CRIBL_CLIENT_SECRET: ${{ secrets.CRIBL_RELEASE_VALIDATION_CLIENT_SECRET }}
          # Temporary: the current validation workspace's datagen host is offline.
          APM_ALLOW_OFFLINE_DATAGEN: 'true'
        run: |
          set -euo pipefail
          test -n "$CRIBL_BASE_URL"
          test -n "$CRIBL_CLIENT_ID"
          test -n "$CRIBL_CLIENT_SECRET"
          npm run deploy -- --artifact build/apm-*.tgz
      - name: Smoke test the candidate through the real Cribl host
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          CRIBL_BASE_URL: ${{ secrets.CRIBL_RELEASE_VALIDATION_BASE_URL }}
          CRIBL_CLIENT_ID: ${{ secrets.CRIBL_RELEASE_VALIDATION_CLIENT_ID }}
          CRIBL_CLIENT_SECRET: ${{ secrets.CRIBL_RELEASE_VALIDATION_CLIENT_SECRET }}
          CRIBL_TEST_EMAIL: ${{ secrets.CRIBL_RELEASE_VALIDATION_TEST_EMAIL }}
          CRIBL_TEST_PASSWORD: ${{ secrets.CRIBL_RELEASE_VALIDATION_TEST_PASSWORD }}
          # Temporary: keep query validation but waive durable-row assertions.
          APM_ALLOW_OFFLINE_DATAGEN: 'true'
        run: |
          set -euo pipefail
          test -n "$CRIBL_TEST_EMAIL"
          test -n "$CRIBL_TEST_PASSWORD"
          npx playwright test \
            tests/apm-smoke.spec.ts \
            tests/resilience-routes.spec.ts \
            tests/live-generated-events.spec.ts \
            tests/live-alert-transition.spec.ts \
            --project=chromium
      - name: Preserve Playwright failure evidence (screenshots, traces, ARIA report)
        # always() so a failing smoke step still uploads its screenshots,
        # traces, videos and the HTML report's ARIA snapshots — otherwise the
        # only evidence of a live-host failure dies with the runner.
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-results-${{ github.sha }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14
