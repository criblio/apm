name: Update lockfile

# Regenerate package-lock.json on a branch in CI. The public @criblio
# packages resolve from npmjs and require no registry credentials.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Regenerate package-lock.json
        run: npm install --package-lock-only
      - name: Commit and push if changed
        run: |
          set -euo pipefail
          if git diff --quiet package-lock.json; then
            echo "lockfile unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: regenerate package-lock.json (update-lockfile workflow)"
          git push
