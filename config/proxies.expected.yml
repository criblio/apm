# Cribl APM external-domain manifest.
#
# The only external dependency is the shared GoatTown service:
# the UI polls it for investigation transcripts (feature-flagged, off
# by default). The platform proxy rewrites the app's fetch() to this
# domain into a same-origin call and injects the bearer from encrypted
# KV (`goattownEmbedToken` = this app's connected-app token), since the iframe can't set
# an Authorization header itself.
#
# The stable shared-service domain is pinned here and in
# config/proxies.expected.yml; the release tooling fails the build if
# the packaged manifest ever diverges from the pinned one.
goattown-shared.lab.cribl.io:
  timeout: 60000
  paths:
    allowlist:
      # Sessions: transcripts, messages, stop/cancel/close.
      - /investigations
      # Agent catalog, and the capability/handshake document.
      - /agents
      - /protocol
      # Configuration proposals: validate, store and diff the app's
      # goattown.config.yaml. Removed in #171 along with the UI call sites,
      # which is why staging failed with "Path is not allowed" rather than
      # any GoatTown error — the proxy rejected it before it left the page.
      - /configurations
      # Default source repos for alert-fired (autonomous) investigations.
      # Interactive runs thread repos at create time under /investigations;
      # this is the only path the autonomous ones can get them from.
      - /config/repos
  headers:
    inject:
      authorization: "'Bearer ' + kv.goattownEmbedToken"
    allowlist:
      - accept
      - content-type
      - x-goattown-user
